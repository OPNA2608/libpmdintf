name: Build

on:
  push:
    branches: main
    tags: 'v*.*.*'
    paths-ignore:
      - '.gitignore'
  pull_request:
    branches: main
    paths-ignore:
      - '.gitignore'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Identify build type.
        id: identify-build
        run: |
          case ${GITHUB_REF} in
            refs/tags/* )
              TAG=${GITHUB_REF#refs/tags/}
              echo "Release ${TAG}"
              echo "build-tag=${TAG}" >> $GITHUB_OUTPUT
              echo "release=true" >> $GITHUB_OUTPUT
              echo "buildVersion=${TAG#v}" >> $GITHUB_OUTPUT # nixpkgs
              ;;
            refs/pull/*)
              PR=$(echo ${GITHUB_REF} | cut -d/ -f3)
              echo "Test PR #${PR}"
              echo "build-tag=pr-${PR}" >> $GITHUB_OUTPUT
              echo "release=false" >> $GITHUB_OUTPUT
              echo "buildVersion=pr-${PR}-${GITHUB_SHA}" >> $GITHUB_OUTPUT # nixpkgs
              ;;
            refs/heads/* )
              BRANCH=${GITHUB_REF#refs/heads/}
              echo "Test ${BRANCH}"
              echo "build-tag=${BRANCH}" >> $GITHUB_OUTPUT
              echo "release=false" >> $GITHUB_OUTPUT
              echo "buildVersion=${BRANCH}-${GITHUB_SHA}" >> $GITHUB_OUTPUT # nixpkgs
              ;;
            * )
              echo "Test (unknown)"
              echo "build-tag=unknown" >> $GITHUB_OUTPUT
              echo "release=false" >> $GITHUB_OUTPUT
              echo "buildVersion=unknown-${GITHUB_SHA}" >> $GITHUB_OUTPUT # nixpkgs
              ;;
          esac

      - name: Checking out repository.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Installing Nix.
        uses: cachix/install-nix-action@v18
        with:
          nix_path: "nixpkgs=channel:nixos-unstable"
      - name: Show Nixpkgs version.
        run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'

      - name: Setup nix-shell
        run: |
          env \
            NIXPKGS_ALLOW_UNFREE=1 \
            nix-shell \
              --run 'echo "nix-shell dependencies have been set up!"'

      - name: Check formatting conformance
        run: |
          env \
            NIXPKGS_ALLOW_UNFREE=1 \
            nix-shell \
              --run 'pre-commit run --all-files'

      - name: Build
        run: |
          env \
            NIXPKGS_ALLOW_UNFREE=1 \
            nix-shell \
              --run 'make -f GNUMakefile'
